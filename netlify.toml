[build]
  command = "npm install && npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/_expo/*"
  to = "/_expo/:splat"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# Enlaces viejos compartidos como /campeonato/:slug (formato anterior) siguen
# funcionando, redirigiendo a la ruta pública real /public/:slug.
[[redirects]]
  from = "/campeonato/*"
  to = "/public/:splat"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
