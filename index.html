    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!--
      PENTAGOLAZO visual layer.
      The app is a react-native-web build: components expose `data-gz-*` hooks
      (see the shared UI kit) so that hover, focus and motion states can be
      expressed here, where CSS does it better than inline RN styles.
    -->
    <style id="gz-theme">
      :root {
        --gz-primary: #0e8a43;
        --gz-primary-dark: #076b33;
        --gz-primary-deep: #04381f;
        --gz-primary-light: #e6f5eb;
        --gz-primary-soft: #cfe9d9;
        --gz-accent: #f5b301;
        --gz-accent-dark: #b07c00;
        --gz-ink: #0f1a15;
        --gz-muted: #87938d;
        --gz-border: #dee7e1;
        --gz-surface: #f5f8f6;
        --gz-ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      }

      /* ---------- Base ---------- */
      body {
        margin: 0;
        background-color: var(--gz-surface);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      #root {
        isolation: isolate;
      }
      ::selection {
        background: rgba(14, 138, 67, 0.18);
        color: var(--gz-ink);
      }

      /* ---------- Scrollbars ---------- */
      * {
        scrollbar-width: thin;
        scrollbar-color: #c6d4cb transparent;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #c6d4cb;
        border-radius: 999px;
        border: 3px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--gz-primary);
      }

      /* ---------- Shared motion + focus ---------- */
      [data-gz] {
        transition: background-color 0.18s var(--gz-ease),
          border-color 0.18s var(--gz-ease), box-shadow 0.22s var(--gz-ease),
          transform 0.22s var(--gz-ease), color 0.16s var(--gz-ease),
          filter 0.18s var(--gz-ease);
        -webkit-tap-highlight-color: transparent;
      }
      [data-gz]:focus-visible {
        outline: 2px solid var(--gz-primary);
        outline-offset: 2px;
      }

      @keyframes gz-rise {
        from {
          opacity: 0;
          transform: translate3d(0, 12px, 0);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }

      /* ---------- Cards ---------- */
      [data-gz="card"] {
        animation: gz-rise 0.3s var(--gz-ease) both;
      }
      [data-gz="cardpress"] {
        border-radius: 18px;
      }
      [data-gz="cardpress"]:hover > [data-gz="card"] {
        transform: translate3d(0, -2px, 0) !important;
        box-shadow: 0 12px 28px rgba(15, 26, 21, 0.12) !important;
        border-color: var(--gz-primary-soft) !important;
      }
      [data-gz="cardpress"]:active > [data-gz="card"] {
        transform: translate3d(0, 0, 0) !important;
        box-shadow: 0 2px 6px rgba(15, 26, 21, 0.1) !important;
      }

      /* ---------- Buttons ---------- */
      [data-gz="btn"][data-gz-off="0"]:hover {
        transform: translate3d(0, -1px, 0) !important;
        filter: saturate(1.05) brightness(1.05);
      }
      [data-gz="btn"][data-gz-off="0"]:active {
        transform: translate3d(0, 0, 0) !important;
        filter: brightness(0.95);
      }
      [data-gz="btn"][data-gzv="outline"][data-gz-off="0"]:hover,
      [data-gz="btn"][data-gzv="ghost"][data-gz-off="0"]:hover {
        background-color: var(--gz-primary-light) !important;
        filter: none;
      }
      [data-gz="btn"][data-gzv="secondary"][data-gz-off="0"]:hover {
        background-color: var(--gz-primary-soft) !important;
        filter: none;
      }

      /* ---------- Chips / section nav ---------- */
      [data-gz="chip"][data-gz-on="0"]:hover,
      [data-gz="navchip"][data-gz-on="0"]:hover {
        background-color: var(--gz-primary-light) !important;
        border-color: var(--gz-primary-soft) !important;
      }
      [data-gz="navchip"][data-gz-on="1"]:hover,
      [data-gz="chip"][data-gz-on="1"]:hover {
        filter: brightness(1.06);
      }

      /* ---------- Live state ---------- */
      @keyframes gz-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.35;
          transform: scale(0.7);
        }
      }
      [data-gz="livedot"] {
        animation: gz-pulse 1.2s ease-in-out infinite;
      }
      [data-gz="badge"][data-gzt="live"] {
        box-shadow: 0 0 0 3px rgba(224, 57, 62, 0.14);
      }

      /* ---------- Pitch-inspired surfaces ---------- */
      [data-gz="hero"] {
        background-color: var(--gz-primary-deep) !important;
        background-image: repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.045) 0 2px,
            rgba(255, 255, 255, 0) 2px 76px
          ),
          linear-gradient(120deg, #10914a 0%, #0a6a34 46%, #04381f 100%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      [data-gz="iconbtn"]:hover {
        background-color: rgba(255, 255, 255, 0.22) !important;
      }
      [data-gz="logomark"] {
        filter: drop-shadow(0 4px 10px rgba(23, 41, 44, 0.18));
      }
      [data-gz="logomark"] img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      [data-gz="emptyicon"] {
        background-image: linear-gradient(140deg, #effaf3, #dcf0e4) !important;
      }
      [data-gz="stripe"] {
        background-image: linear-gradient(
          90deg,
          var(--gz-primary) 0%,
          #12a050 45%,
          var(--gz-accent) 100%
        ) !important;
      }
      [data-gz="score"][data-gz-on="1"] {
        background-image: linear-gradient(135deg, #0b6e38 0%, #04381f 100%) !important;
        box-shadow: 0 2px 8px rgba(4, 56, 31, 0.22);
      }

      /* ---------- Standings & ranking rows ---------- */
      [data-gz="thead"] {
        background-image: repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.05) 0 2px,
            rgba(255, 255, 255, 0) 2px 64px
          ),
          linear-gradient(90deg, #0a6a34, #04381f) !important;
      }
      [data-gz="trow"] {
        animation: gz-rise 0.28s var(--gz-ease) both;
      }
      [data-gz="trow"]:hover {
        background-color: #f1f7f3 !important;
      }
      [data-gz="trow"][data-gz-rank="1"] {
        box-shadow: inset 3px 0 0 var(--gz-accent);
      }
      [data-gz="trow"][data-gz-rank="2"] {
        box-shadow: inset 3px 0 0 #afbab4;
      }
      [data-gz="trow"][data-gz-rank="3"] {
        box-shadow: inset 3px 0 0 #c1803f;
      }
      [data-gz="trow"][data-gz-rank="1"] [data-gz="pos"] {
        box-shadow: 0 2px 6px rgba(245, 179, 1, 0.45);
      }
      [data-gz="trow"]:nth-child(2) { animation-delay: 0.02s; }
      [data-gz="trow"]:nth-child(3) { animation-delay: 0.04s; }
      [data-gz="trow"]:nth-child(4) { animation-delay: 0.06s; }
      [data-gz="trow"]:nth-child(5) { animation-delay: 0.08s; }
      [data-gz="trow"]:nth-child(6) { animation-delay: 0.1s; }
      [data-gz="trow"]:nth-child(7) { animation-delay: 0.12s; }
      [data-gz="trow"]:nth-child(8) { animation-delay: 0.14s; }
      [data-gz="trow"]:nth-child(n + 9) { animation-delay: 0.16s; }

      /* ---------- Boot screen ---------- */
      #gz-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background-color: #04381f;
        background-image: repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.035) 0 2px,
            rgba(255, 255, 255, 0) 2px 84px
          ),
          linear-gradient(150deg, #0e8a43 0%, #076b33 45%, #04381f 100%);
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #gz-splash.gz-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .gz-mark {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 38px;
        line-height: 1;
        background-image: linear-gradient(140deg, #13a554, #065e2d);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28),
          0 0 0 3px rgba(245, 179, 1, 0.45);
        animation: gz-bounce 1.5s var(--gz-ease) infinite;
      }
      @keyframes gz-bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      .gz-word {
        font: 900 28px/1 Inter, -apple-system, BlinkMacSystemFont, sans-serif;
        letter-spacing: -0.8px;
        color: #fff;
        margin: 0;
      }
      .gz-sub {
        font: 600 11px/1 Inter, -apple-system, BlinkMacSystemFont, sans-serif;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.6);
        margin: -8px 0 0;
      }
      .gz-bar {
        width: 120px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        overflow: hidden;
      }
      .gz-bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: var(--gz-accent);
        animation: gz-slide 1.1s ease-in-out infinite;
      }
      @keyframes gz-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }

      /* ---------- Accessibility ---------- */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <!-- Branded boot screen, removed as soon as the app mounts. -->
    <div id="gz-splash" aria-hidden="true">
      <div class="gz-mark">&#9917;</div>
      <p class="gz-word">PENTAGOLAZO</p>
      <p class="gz-sub">Campeonatos de Fútbol 6</p>
      <div class="gz-bar"><i></i></div>
    </div>

    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  <script src="/_expo/static/js/web/entry-8d1c08f1d1a8f433d60190916bbf67ac.js" defer></script>
    <script>
      (function () {
        var splash = document.getElementById('gz-splash');
        var root = document.getElementById('root');
        if (!splash || !root) return;
        var hidden = false;
        function hide() {
          if (hidden) return;
          hidden = true;
          splash.classList.add('gz-hide');
          setTimeout(function () {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 450);
        }
        if (root.childElementCount > 0) {
          setTimeout(hide, 120);
          return;
        }
        var observer = new MutationObserver(function () {
          if (root.childElementCount > 0) {
            observer.disconnect();
            setTimeout(hide, 120);
          }
        });
        observer.observe(root, { childList: true });
        // Never let the boot screen outlive a slow or failed bundle load.
        setTimeout(function () {
          try { observer.disconnect(); } catch (e) {}
          hide();
        }, 9000);
      })();
    </script>
</body>
