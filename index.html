    <!--
      PENTAGOLAZO shell styling.
      The app itself (a react-native-web build) owns its component styling; this

    -->
    <style id="gz-theme">
      :root {
        --gz-primary: #0e8a43;
        --gz-accent: #f5b301;
        --gz-ink: #0f1a15;
        --gz-surface: #f5f8f6;
        --gz-ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      }

      /* ---------- Base ---------- */
      body {
        margin: 0;
        background-color: var(--gz-surface);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      #root {
        isolation: isolate;
      }
      ::selection {
        background: rgba(14, 138, 67, 0.18);
        color: var(--gz-ink);
      }

      /* ---------- Scrollbars ---------- */
      * {
        scrollbar-width: thin;
        scrollbar-color: #c6d4cb transparent;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #c6d4cb;
        border-radius: 999px;
        border: 3px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--gz-primary);
      }

      /* ---------- Shared motion + focus ---------- */
      #root * {
        -webkit-tap-highlight-color: transparent;
      }
      #root :focus-visible {
        outline: 2px solid var(--gz-primary);
        outline-offset: 2px;
      }

      /* ---------- Boot screen ---------- */
      #gz-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background-color: #04381f;
        background-image: repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.035) 0 2px,
            rgba(255, 255, 255, 0) 2px 84px
          ),
          linear-gradient(150deg, #0e8a43 0%, #076b33 45%, #04381f 100%);
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #gz-splash.gz-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .gz-mark {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 38px;
        line-height: 1;
        background-image: linear-gradient(140deg, #13a554, #065e2d);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28),
          0 0 0 3px rgba(245, 179, 1, 0.45);
        animation: gz-bounce 1.5s var(--gz-ease) infinite;
      }
      @keyframes gz-bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      .gz-word {
        font: 900 28px/1 Inter, -apple-system, BlinkMacSystemFont, sans-serif;
        letter-spacing: -0.8px;

        margin: 0;
      }
      .gz-sub {

      .gz-bar {

        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        overflow: hidden;
      }
      .gz-bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: var(--gz-accent);
        animation: gz-slide 1.1s ease-in-out infinite;
      }
      @keyframes gz-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }

      /* ---------- Accessibility ---------- */
      @media (prefers-reduced-motion: reduce) {

    <script>
      (function () {
        var splash = document.getElementById('gz-splash');
        var root = document.getElementById('root');
        if (!splash || !root) return;
        var hidden = false;
        function hide() {
          if (hidden) return;
          hidden = true;
          splash.classList.add('gz-hide');
          setTimeout(function () {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 450);
        }
        if (root.childElementCount > 0) {
          setTimeout(hide, 120);
          return;
        }
        var observer = new MutationObserver(function () {
          if (root.childElementCount > 0) {
            observer.disconnect();
            setTimeout(hide, 120);
          }
        });
        observer.observe(root, { childList: true });
        // Never let the boot screen outlive a slow or failed bundle load.
        setTimeout(function () {
          try { observer.disconnect(); } catch (e) {}
          hide();
        }, 9000);
      })();
    </script>
